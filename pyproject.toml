[project]
name = "dqn-atari"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kibet-Rotich", email = "kibet.rotich2022@students.jkuat.ac.ke" }
]
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium[atari]>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "torch>=2.15.0",
]

[project.scripts]
dqn-atari = "dqn_atari:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
